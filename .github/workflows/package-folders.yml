name: Package folder downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip each folder's contents
        run: |
          for d in csgo firefox ShareX tf2; do
            (cd "$d" && zip -qr "../$d.zip" .)
          done

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest configs
          body: |
            Auto-built zips of each config folder. Each zip contains the folder's contents directly.
          files: |
            csgo.zip
            firefox.zip
            ShareX.zip
            tf2.zip
